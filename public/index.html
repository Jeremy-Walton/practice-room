<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Drills</title>
<meta name="description" content="Find and name notes, scales and chords across the whole piano keyboard.">
<meta name="theme-color" content="#1f6b58">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Piano Drills</div>
    <div class="topr">
      <span id="sync" class="sync"></span>
      <button class="ghost" data-act="settings">Settings</button>
    </div>
  </header>
  <aside class="side" aria-label="Levels"><nav id="levels"></nav></aside>
  <main id="stage" class="stage"></main>
  <section class="piano" aria-label="Piano">
    <div class="case"><div id="keys" class="keys"></div></div>
    <p class="hint">Click keys to select them · <kbd>Enter</kbd> check / next · <kbd>Space</kbd> play · <kbd>Esc</kbd> clear · type <kbd>A</kbd>–<kbd>'</kbd> to play, <kbd>1</kbd>–<kbd>8</kbd> octave <b id="oct">4</b></p>
  </section>
</div>
<dialog id="settings" aria-label="Settings"></dialog>
<noscript>Piano Drills needs JavaScript.</noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
